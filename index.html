<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>TaskFlow Board</h1>
    </header>

    <main>
        <!-- Task Creation Form -->
        <section class="form-section">
            <form id="taskForm">
                <label for="taskTitleInput" class="sr-only">Task title</label>
                <input type="text" id="taskTitleInput" placeholder="Task Title" required autocomplete="off">

                <label for="taskDescInput" class="sr-only">Task description, optional</label>
                <input type="text" id="taskDescInput" placeholder="Task Description (Optional)" autocomplete="off">

                <button type="submit">Add Task</button>
            </form>
        </section>

        <!--Board -->
        <section class="board-container">
            <section class="column" id="col-todo" aria-labelledby="todo-heading">
                <h2 id="todo-heading">To Do</h2>
                <ul id="todo-list" class="task-list"></ul>
            </section>

            <section class="column" id="col-in-progress" aria-labelledby="in-progress-heading">
                <h2 id="in-progress-heading">In Progress</h2>
                <ul id="in_progress-list" class="task-list"></ul>
            </section>

            <section class="column" id="col-done" aria-labelledby="done-heading">
                <h2 id="done-heading">Done</h2>
                <ul id="done-list" class="task-list"></ul>
            </section>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
